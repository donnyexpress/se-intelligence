name = "tech-scan"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# This is a Cloudflare **Pages** project (static site + Functions).
#
# CRITICAL: In the Cloudflare Pages dashboard, the **Build command**
# must be EMPTY. If it contains `npx wrangler deploy` or
# `npx wrangler pages deploy ...`, the build will fail with
# "CLOUDFLARE_API_TOKEN required" or similar.
#
# With an empty build command, Pages:
#   - serves the repo root as the static site
#   - auto-detects Functions in ./functions/api/*.js
#   - applies KV bindings from this file
#   - applies any environment variables / secrets you set
#
# Do NOT set pages_build_output_dir here — when set, wrangler resolves
# it relative to the build cwd (e.g. "../../.."), breaking the deploy.
# Leave it unset; Pages defaults to the repo root.

[[kv_namespaces]]
binding = "COMMENTS_KV"
id = "576aa003d33b49c1affb3bbbeda491d8"
