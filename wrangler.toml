name = "tech-scan"
pages_build_output_dir = "."
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# This is a Cloudflare **Pages** project (static site + Functions).
# Cloudflare Pages does NOT run `wrangler deploy` automatically — it
# detects this file and uses `wrangler pages deploy` semantics.
# If your build command in the dashboard runs `wrangler deploy` and
# fails with "Missing entry-point", set the build command to:
#   npx wrangler pages deploy . --project-name=tech-scan
# (or, for newer Pages projects, the build command can be empty —
# Pages will serve the contents of `pages_build_output_dir` directly).

[[kv_namespaces]]
id = "576aa003d33b49c1affb3bbbeda491d8"
binding = "COMMENTS_KV"

[env.production]
kv_namespaces = [
  { id = "576aa003d33b49c1affb3bbbeda491d8", binding = "COMMENTS_KV" }
]
