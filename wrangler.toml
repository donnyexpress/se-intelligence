name = "tech-scan"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "/"

# This is a Cloudflare **Pages** project (static site + Functions).
# Pages reads pages_build_output_dir from this file. It is the only
# field Pages cares about in wrangler.toml. Functions in ./functions/
# are auto-detected. KV bindings below are also auto-applied.

# The default Cloudflare Pages build command works for this project
# (no build step needed). If the dashboard shows a build command of
# `npx wrangler deploy`, change it to empty in:
#   Settings → Build → Build configurations → Build command
# Or to: `npx wrangler pages deploy . --project-name=tech-scan --commit-dirty=true`

[[kv_namespaces]]
binding = "COMMENTS_KV"
id = "576aa003d33b49c1affb3bbbeda491d8"
