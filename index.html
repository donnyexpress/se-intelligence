<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Scan</title>
  <meta name="robots" content="index, follow" />
  <script>
    // Detect the site's base path. Works for:
    //   - Custom domain or apex        → '/'
    //   - GitHub Pages user site        → '/'
    //   - GitHub Pages project site     → '/<repo>/'  (inferred from URL)
    //   - Cloudflare Pages              → '/'
    //   - Local dev                     → '/'
    (function() {
      var path = location.pathname;
      var base = '/';
      if (location.hostname.endsWith('github.io')) {
        // Project Pages: hostname is <user>.github.io, repo name is the first
        // path segment. User Pages: hostname is <user>.github.io, path is '/'.
        var m = path.match(/^\/([^\/]+)\//);
        if (m) base = '/' + m[1] + '/';
      } else if (path.indexOf('/index.html') === 0 || /^\/[^/]+\.html$/.test(path)) {
        // Static export to a sub-path: leave base at '/'.
        base = path.replace(/[^\/]*$/, '');
      }
      var b = document.createElement('base');
      b.href = base;
      document.head.appendChild(b);
    })();
  </script>
  <meta name="description" content="A scanning log for systems engineers. INCOSE-aligned topics, conference proceedings, and curated reading on the discipline of SE." />
  <meta name="theme-color" content="#0f0c29" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
</head>
<body>
  <div class="mobile-bar">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
    <a href="/" class="brand">Tech Scan</a>
    <button class="search-toggle" id="search-toggle" aria-label="Search">🔍</button>
  </div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Tech Scan</div>
      <div class="brand-sub">Loading…</div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main" id="main">
      <p style="color: var(--ink-faint);">Loading…</p>
    </main>
  </div>
  <div class="mobile-search-modal" id="mobile-search-modal">
    <button class="close-btn" id="search-close" aria-label="Close">×</button>
    <input type="text" id="mobile-search-input" placeholder="Search…" autocomplete="off" />
    <div class="results" id="mobile-search-results"></div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/parser.js"></script>
  <script src="assets/entries-index.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function() {
      const menuBtn = document.getElementById('menu-btn');
      const shell = document.querySelector('.shell');
      const overlay = document.getElementById('sidebar-overlay');
      if (menuBtn) menuBtn.addEventListener('click', () => shell.classList.toggle('panel-open'));
      if (overlay) overlay.addEventListener('click', () => shell.classList.remove('panel-open'));
      document.addEventListener('click', (e) => {
        if (e.target.closest('.flat-entries a, .domain-entries a, a.brand')) shell.classList.remove('panel-open');
      });
    })();
  </script>
</body>
</html>
